name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm v10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create Universal Android Bridge & Fix Configs
        run: |
          node -e '
            const fs = require("fs");

            // 1. Create a bulletproof universal bridge script
            const bridgeCode = `
            (function() {
              window.process = window.process || {
                platform: "linux",
                arch: "arm64",
                type: "renderer",
                env: { NODE_ENV: "production" },
                versions: { electron: "44.0.0", chrome: "126.0.0.0", node: "22.0.0" }
              };

              function createProxy(path) {
                var target = function() {};
                return new Proxy(target, {
                  has: function() { return true; },
                  get: function(t, p) {
                    if (p === Symbol.toPrimitive) return function() { return ""; };
                    if (p === "then") return undefined;
                    if (p === "__esModule") return true;
                    var s = String(p);
                    if (s === "platform") return "linux";
                    if (s === "isElectron" || s === "isDesktop" || s === "online" || s === "isOnline" || s === "ok" || s === "available" || s === "supported") return true;
                    if (s === "offline" || s === "isOffline" || s === "isMaximized" || s === "isMinimized") return false;
                    if (["map", "filter", "slice", "concat", "forEach"].includes(s)) return function() { return []; };
                    return createProxy(path ? path + "." + s : s);
                  },
                  apply: function(t, thisArg, args) {
                    var lower = (path || "").toLowerCase();
                    if (lower.includes("offline")) return Promise.resolve(false);
                    if (lower.includes("online") || lower.includes("status") || lower.includes("health")) return Promise.resolve({ ok: true, online: true });
                    if (lower.includes("get") || lower.includes("load")) return Promise.resolve(null);
                    return Promise.resolve(true);
                  }
                });
              }

              var universal = createProxy("");
              ["electron", "electronAPI", "api", "desktop", "bridge", "ipcRenderer", "liner"].forEach(function(name) {
                try { window[name] = universal; } catch(e) {}
              });
            })();
            `;
            fs.mkdirSync("public", { recursive: true });
            fs.writeFileSync("public/android-bridge.js", bridgeCode, "utf8");

            // 2. Inject bridge into index.html
            if (fs.existsSync("index.html")) {
              let html = fs.readFileSync("index.html", "utf8");
              html = html.replace(/<meta[^>]*http-equiv=["\x27]Content-Security-Policy["\x27][^>]*>/gi, "");
              if (!html.includes("android-bridge.js")) {
                html = html.replace("<head>", "<head>\n    <script src=\"./android-bridge.js\"></script>");
              }
              fs.writeFileSync("index.html", html, "utf8");
            }

            // 3. Ensure base relative in vite.config.ts
            if (fs.existsSync("vite.config.ts")) {
              let v = fs.readFileSync("vite.config.ts", "utf8");
              if (!v.includes("base:")) {
                v = v.replace("defineConfig({", "defineConfig({\n  base: \"./\",");
                fs.writeFileSync("vite.config.ts", v, "utf8");
              }
            }
          console.log("Android patch applied successfully!");
          '

      - name: Build Vite web frontend
        run: pnpm exec vite build --base=./ --outDir dist

      - name: Wrap frontend with Capacitor & Build APK
        run: |
          pnpm add -D @capacitor/cli
          pnpm add @capacitor/core @capacitor/android
          npx cap init "Liner" "fun.tryliner.mobile" --web-dir dist
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "fun.tryliner.mobile",
            "appName": "Liner",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap copy android

      - name: Compile Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Liner-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
